<!DOCTYPE html>
<head>
<title>Koi</title>
<style>
  body {
    margin: 0;
    background: rgb(0 0 0);
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
  <canvas id="canvas" height="600" width="800"></canvas>
  <script>
    // Based on mathewmolt's Artificial Koi
    // https://codeberg.org/mathewmolt/ArtificialKoi/
    // which in turn is based on animations by @yuruyurau
    // https://x.com/yuruyurau
    const canvas = document.getElementById("canvas");
    const context = canvas.getContext("2d");
    var scale;
    var cx;
    var cy;

    function handleResize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      scale = (Math.min(canvas.width, canvas.height) / 400.0)
      cx = canvas.width / 2;
      cy = canvas.height / 2;
    }

    window.addEventListener("resize", handleResize);
    handleResize();

    function compute(i, n, t, cc, sf, sa) {
      var y = i / 500.0;
      var k = Math.cos(y * 5.3 * sf) * (y < 8.6 ? 22.0 : 10.5);
      if (Math.abs(k) < 1e-6) return null;
      var e = y / 7.6 - 13.4;
      var o = Math.sqrt(k * k + e * e) / 6.2;
      var q = (k * y / 12.4 + 71 + Math.sin(y * 1.1) / k + k * Math.cos(y / 2.1) * 1.9 * Math.sin(o * 3.1 - e / 1.9 - t)) * sa;
      var c = o * e / 18.4 + t / 8 + (i % cc) * 8.0;
      return [q * Math.cos(c) + 200, 200 + q * Math.sin(c) + 93 * Math.cos(c / 2) + 6 * Math.sin(c * 1.5)];
    }

    const sf    = 1.0; // shape frequency
    const sa    = 1.0; //shape amp
    const cc    = 3; // creature count
    const n     = 20000; // point count
    const t     = Math.PI / 60; // time step

    context.fillStyle = "red";

    var tick = 0;
    function onTick () {
      context.clearRect(0, 0, canvas.width, canvas.height);
      var pts = [];
      var writeIdx = 0;
      for (i = n - 1; i >= 0; i--) {
        const r = compute(i, n, tick, cc, sf, sa);
        if (r == null) continue;
        const [px, py] = r;
        if (px == Infinity || py == Infinity) continue;
        // pts[writeIdx++] = cx + (px - 200) * scale;
        // pts[writeIdx++] = cy + (py - 200) * scale;
        context.fillRect(cx + (px - 200) * scale, cy + (py - 200) * scale, 1, 1);
      }
      tick = tick + t;
      requestAnimationFrame(onTick);
    }
    onTick();
  </script>
</body>
